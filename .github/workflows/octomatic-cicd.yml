name: OctaMatic CI/CD

# Triggers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, jf, feature1]
#   workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_LOCATION: canadaeast
  AZURE_RESOURCE_GROUP: OctoMatic
  AZURE_WEBAPP_NAME: octomatic

jobs:
  # Name of the job
  build:
    # Runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore OctoMatic.csproj

      - name: Build
        run: dotnet build OctoMatic.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish production build
        run: dotnet publish OctoMatic.csproj --configuration Release --no-build --output publish

      - name: Package production build
        run: |
          mkdir -p artifacts
          cd publish
          zip -r ../artifacts/OctoMatic.zip .

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: OctoMatic-production
          path: artifacts/OctoMatic.zip
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout only the infra/ directory
          sparse-checkout: infra

      - name: Sign in to Azure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure infrastructure
        run: |
          az deployment group create \
            --name "octomatic-${{ github.run_id }}-${{ github.run_attempt }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters location="$AZURE_LOCATION" \
            --only-show-errors \
            --output table

      - name: Download production package
        uses: actions/download-artifact@v4
        with:
          name: OctoMatic-production
          path: artifacts

      - name: Deploy application to App Service
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path artifacts/OctoMatic.zip \
            --type zip \
            --clean true \
            --restart true \
            --only-show-errors \
            --output table
