name: OctaMatic CI/CD

# Triggers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, jf, feature1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Name of the job
  build:
    # Runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore OctoMatic.csproj

      - name: Build
        run: dotnet build OctoMatic.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish production build
        run: dotnet publish OctoMatic.csproj --configuration Release --no-build --output publish

      - name: Package production build
        run: |
          mkdir -p artifacts
          cd publish
          zip -r ../artifacts/OctoMatic.zip .

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: OctoMatic-production
          path: artifacts/OctoMatic.zip
          if-no-files-found: error