name: OctaMatic CI/CD

# Triggers
on:
  push:
    branches: 
    - main
    - jf
    - feature1
  pull_request:
    branches: [main, jf, feature1]

permissions:
  contents: read

jobs:
  # Name of the job
  build-and-test:
    # Runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore OctoMatic.csproj

      - name: Build
        run: dotnet build OctoMatic.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build